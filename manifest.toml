#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "filepizza"
name = "FilePizza"
description.en = "Peer-to-peer file transfers in your browser"
description.fr = "Transferts de fichiers pair-à-pair dans votre navigateur"

version = "2026.11.02~ynh1"

maintainers = []

[upstream]
license = "BSD-3-Clause"
website = "https://file.pizza/"
demo = "https://file.pizza/"
code = "https://github.com/kern/filepizza"
fund = "https://commerce.coinbase.com/pay/84f58214-142c-4d5d-ad0b-c275972eee8a"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/kern/filepizza/archive/1e4d02fa91527d8dc83f4094ca394f8c29a88b56.tar.gz"
    sha256 = "c5eb60f939cb56c90e5f5635218d1a40e3e52fed1b3a277c0a3a897c019a7b04"
    autoupdate.upstream = "https://github.com/kern/filepizza"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    turn.default = 3478

    [resources.nodejs]
    version = "22"
